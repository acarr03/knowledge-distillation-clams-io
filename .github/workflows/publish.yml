name: Publish @acarr03/distillation

# Publishes the package to GitHub Packages (npm) when a GitHub Release is published,
# or on demand via the "Run workflow" button (workflow_dispatch). Bump the version in
# package.json (npm version patch|minor|major) before publishing — GitHub Packages, like
# npm, rejects re-publishing an existing version.
on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write        # lets the built-in GITHUB_TOKEN publish to GitHub Packages

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@acarr03'
      - run: npm ci
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
